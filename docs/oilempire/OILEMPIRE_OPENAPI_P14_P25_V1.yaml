  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      },
      "cookieAuth": {
        "type": "apiKey",
        "in": "cookie",
        "name": "laravel_session"
      },
      "providerSignature": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Provider-Signature"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "code",
          "message_key",
          "trace_id"
        ],
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "POLICY_NOT_APPROVED",
              "FORBIDDEN",
              "NOT_FOUND",
              "STATE_CONFLICT",
              "VERSION_CONFLICT",
              "INSUFFICIENT_FUNDS",
              "INSUFFICIENT_STOCK",
              "RATE_LIMITED",
              "VALIDATION_FAILED",
              "PROVIDER_SIGNATURE_INVALID"
            ]
          },
          "message_key": {
            "type": "string"
          },
          "trace_id": {
            "type": "string"
          },
          "retryable": {
            "type": "boolean"
          }
        }
      },
      "OperationResult": {
        "type": "object",
        "required": [
          "data",
          "meta"
        ],
        "properties": {
          "data": {
            "type": "object",
            "required": [
              "resource_id",
              "state",
              "state_version"
            ],
            "properties": {
              "resource_id": {
                "type": "string",
                "pattern": "^[0-9A-HJKMNP-TV-Z]{26}$"
              },
              "state": {
                "type": "string"
              },
              "state_version": {
                "type": "integer",
                "minimum": 0
              }
            }
          },
          "meta": {
            "type": "object",
            "required": [
              "logical_at",
              "balance_version",
              "contract_version"
            ],
            "properties": {
              "logical_at": {
                "type": "string",
                "format": "date-time"
              },
              "balance_version": {
                "type": "string"
              },
              "contract_version": {
                "type": "string"
              }
            }
          }
        }
      }
    }
  }
