  "components": {
    "schemas": {
      "CreateCompany": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          }
        },
        "required": [
          "name"
        ],
        "additionalProperties": false
      },
      "HireEmployee": {
        "type": "object",
        "properties": {
          "candidate_offer_id": {
            "type": "string",
            "minLength": 1
          },
          "accepted_salary_minor": {
            "type": "string",
            "pattern": "^[0-9]+$"
          }
        },
        "required": [
          "candidate_offer_id",
          "accepted_salary_minor"
        ],
        "additionalProperties": false
      },
      "RaiseDecision": {
        "type": "object",
        "properties": {
          "action": {
            "enum": [
              "accept",
              "counteroffer",
              "refuse",
              "defer"
            ]
          },
          "offered_salary_minor": {
            "type": "string",
            "pattern": "^[0-9]+$"
          },
          "expected_state_version": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "action",
          "expected_state_version"
        ],
        "additionalProperties": false
      },
      "EnrollEmployee": {
        "type": "object",
        "properties": {
          "employee_id": {
            "type": "string",
            "minLength": 1
          },
          "program_id": {
            "type": "string",
            "minLength": 1
          },
          "level": {
            "type": "integer",
            "minimum": 1,
            "maximum": 3
          },
          "expected_state_version": {
            "type": "integer",
            "minimum": 0
          },
          "expected_catalog_version": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "employee_id",
          "program_id",
          "level",
          "expected_state_version",
          "expected_catalog_version"
        ],
        "additionalProperties": false
      },
      "ApplyPermit": {
        "type": "object",
        "properties": {
          "region_id": {
            "type": "string",
            "minLength": 1
          },
          "permit_type": {
            "enum": [
              "P1",
              "P2"
            ]
          },
          "expected_scope_version": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "region_id",
          "permit_type",
          "expected_scope_version"
        ],
        "additionalProperties": false
      },
      "DrillWell": {
        "type": "object",
        "properties": {
          "stratum_id": {
            "type": "string",
            "minLength": 1
          },
          "survey_id": {
            "type": "string",
            "minLength": 1
          },
          "equipment_tier": {
            "type": "string",
            "minLength": 1
          },
          "expected_state_version": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "stratum_id",
          "survey_id",
          "equipment_tier",
          "expected_state_version"
        ],
        "additionalProperties": false
      },
      "DispatchTrip": {
        "type": "object",
        "properties": {
          "vehicle_id": {
            "type": "string",
            "minLength": 1
          },
          "source_ref": {
            "type": "object",
            "properties": {
              "type": {
                "type": "string",
                "minLength": 1
              },
              "id": {
                "type": "string",
                "minLength": 1
              }
            },
            "required": [
              "type",
              "id"
            ],
            "additionalProperties": false
          },
          "destination_ref": {
            "type": "object",
            "properties": {
              "type": {
                "type": "string",
                "minLength": 1
              },
              "id": {
                "type": "string",
                "minLength": 1
              }
            },
            "required": [
              "type",
              "id"
            ],
            "additionalProperties": false
          },
          "quantity_bbl": {
            "type": "string",
            "pattern": "^[0-9]+([.][0-9]{1,4})?$"
          },
          "route_option": {
            "type": "string",
            "minLength": 1
          },
          "expected_source_version": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "vehicle_id",
          "source_ref",
          "destination_ref",
          "quantity_bbl",
          "route_option",
          "expected_source_version"
        ],
        "additionalProperties": false
      },
      "StartTechnicalTask": {
        "type": "object",
        "properties": {
          "type": {
            "type": "string",
            "minLength": 1
          },
          "target_ref": {
            "type": "object",
            "properties": {
              "type": {
                "type": "string",
                "minLength": 1
              },
              "id": {
                "type": "string",
                "minLength": 1
              }
            },
            "required": [
              "type",
              "id"
            ],
            "additionalProperties": false
          },
          "provider_kind": {
            "enum": [
              "internal",
              "external",
              "private_fire"
            ]
          },
          "staff_id": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "type",
          "target_ref",
          "provider_kind"
        ],
        "additionalProperties": false
      }
    }
  },
