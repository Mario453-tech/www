  banking:
    enabled: true
    premium: false
    params_version: 1
    source_sections: "§17"
    params:
      credit_score_formula:  # §17.1 kanon (K4)
        range: [0, 115]
        formula: 'clamp(0,115,round(0.35*credibility + 0.35*history + 0.20*solvency + 0.10*tenure + clean_bonus))'
        history_no_record_pts: 40
        clean_bonus_per_clean_month: 1.25
        clean_bonus_cap: 15   # jedyne źródło 100–115 (§2)
        caps: {bankruptcy_history: 40, bankruptcy_cap_days: 365, active_late_delta: -10, active_bailiff: 0}
        recalculate_on: [loan_application, installment_settlement, bankruptcy_transition, late_transition]
      banking:                                                 # §17
        credit_score_min: 0                                    # §17.1
        credit_score_max: 115                                  # §17.1 — nadwyżka >100 = bonus za nieskazitelną historię spłat
        # credit_score = f(company_credibility, historia spłat, zadłużenie/aktywa) — formuła i wagi w game_balance (§17.1, wartości niepodane)
        credit_tiers:                                          # §17.1
          - score_min: 0                                       # §17.1 — 0–39: brak zdolności kredytowej
            score_max: 39
            max_loan_pln: 0
          - score_min: 40                                      # §17.1
            score_max: 59
            max_loan_pln: 2000000
            interest_pct_per_year: 12
            max_term_days: 30
          - score_min: 60                                      # §17.1
            score_max: 79
            max_loan_pln: 10000000
            interest_pct_per_year: 8
            max_term_days: 60
          - score_min: 80                                      # §17.1
            score_max: 99
            max_loan_pln: 40000000
            interest_pct_per_year: 5
            max_term_days: 90
          - score_min: 100                                     # §17.1
            score_max: 115
            max_loan_pln: 100000000
            interest_pct_per_year: 3.5
            max_term_days: 120
        bank_trust_score_min: 0                                # §17.1 — pojedynczy wskaźnik 0–100
        bank_trust_score_max: 100                              # §17.1
        installment_interval_h: 24                             # §17.1 — raty automatycznie co 24h gry z PLN_BANK
        late_interest_addon_pct_of_base: 150                   # §17.1 — odsetki karne +150% stopy bazowej
        late_bank_trust_delta_per_week: -5                     # §17.1
        late_to_bailiff_phase1_h: 72                           # §17.1 — 72h w late bez spłaty → Faza 1 komornika
        early_repayment_credibility_delta: 6                   # §17.1 (odsyłacz §2)
        ontime_installment_credibility_delta: 2                # §17.1
        bailiff_phase1_garnish_pct: 50                         # §17.2 — 50% KAŻDEGO wpływu na PLN_BANK i PLN_CASH
        bailiff_phase1_to_phase2_days: 7                       # §17.2 — bez zatwierdzonego planu spłaty
        bailiff_phase2_oil_price_pct_of_market: 70             # §17.2 — licytacja ropy z magazynu głównego (wyłączone locked_in_escrow_bbl, reserved_bbl)
        bailiff_phase3_start_price_pct_of_valuation: 60        # §17.2 — aukcja odwiertów od najmniej rentownego; cena wywoławcza 60% wyceny
        bailiff_entry_credibility_delta: -20                   # §17.2 (odsyłacz §2)
        bankruptcy_illiquidity_window_h: 48                    # §17.3 — majątek netto <0 ORAZ brak płynności na OPEX/pensje przez 48h
        bankruptcy_credibility_delta: -25                      # §17.3
        recovery_plan_duration_days: 7                         # §17.3 — plan naprawczy (recovery_mode); Kroplówka GBBL zablokowana
        recovery_success_credibility_delta: 8                  # §17.3 — wyjście z recovery_mode
        recovery_breach_credibility_delta: -10                 # §17.3 — złamanie planu → powrót do egzekucji Fazy 2/3
        incidents:                                             # §17.4
          bhp_risk_coefficient: 0.12                           # §17.4 — risk × (1 − 0.12 × bhp_level)
          bhp_level_min: 1                                     # §17.4 (odsyłacz §11)
          bhp_level_max: 5                                     # §17.4
          procedure_integrity_mult_full: 1.0                   # §17.4 — (2 − procedure_integrity/100) = 1.0 przy 100%
          procedure_integrity_mult_zero: 2.0                   # §17.4 — 2.0 przy 0% (zużyte procedury podwajają ryzyko)
          skill_safety_risk_coefficient: 0.05                  # §17.4 — × (1 − 0.05 × skill_safety)
          budget_bhp_mult_low: 1.5                             # §17.4 (odsyłacz §10)
          budget_bhp_mult_standard: 1.0                        # §17.4
          budget_bhp_mult_high: 0.7                            # §17.4
          strike_risk_mult: 2.0                                # §17.4 — strike_multiplier przy strajku technicznym (odsyłacz §5.1)
          condition_risk_threshold_pct: 20                     # §17.4 — base_risk rośnie przy condition <20% (tabela w game_balance — wartości niepodane)
          eco_catastrophe_credibility_delta: -15               # §17.4 — katastrofa ekologiczna (odsyłacz §2)
          repair_time_strike_mult: 1.4                         # §17.4 — czas naprawy przy strajku technicznym
          external_repair_crew_cost_mult: 2.5                  # §17.4 — firma zewnętrzna (także §21 — wartość identyczna)
          private_guard_cost_gbbl: 35                          # §17.4 — Prywatna Straż przy blowout (odsyłacz §22.3 — wartość identyczna)

