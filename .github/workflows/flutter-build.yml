name: Build Flutter APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flutter-build.yml'
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: mobile
        run: flutter test

      - name: Configure Android release signing
        id: signing
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && \
             [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${ANDROID_KEY_ALIAS:-}" ] && \
             [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/oilempire-release.jks
            {
              printf 'storeFile=app/oilempire-release.jks\n'
              printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            } > key.properties
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets missing — building debug APK (suitable for side-loading, not Google Play)"
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: mobile
        run: |
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            flutter build apk --release
          else
            flutter build apk --debug
          fi

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OilEmpire-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-${{ steps.signing.outputs.mode }}.apk
          retention-days: 30

      - name: Rename APK
        run: cp mobile/build/app/outputs/flutter-apk/app-${{ steps.signing.outputs.mode }}.apk OilEmpire.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "OilEmpire build #${{ github.run_number }}"
          body: "Automatyczny build z CI. Pobierz i zainstaluj plik OilEmpire.apk na telefonie."
          files: OilEmpire.apk
          make_latest: true
