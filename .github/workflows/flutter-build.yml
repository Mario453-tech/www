name: Build Flutter APK / Shorebird OTA

# HOW IT WORKS:
#  push to main        → shorebird patch  (OTA update, no reinstall needed)
#  workflow_dispatch   → shorebird release (new base APK, install once on phone)
#
# FIRST-TIME SETUP (do once on your machine):
#  1. npm i -g @shorebird/cli  OR  brew install shorebirdtech/tap/shorebird
#  2. shorebird login
#  3. cd mobile && shorebird init        ← creates shorebird.yaml with app_id
#  4. shorebird release android          ← builds first APK, install it on phone
#  5. In GitHub repo Settings → Secrets add:
#       SHOREBIRD_TOKEN  (from: shorebird login --print-token)
#     Also keep signing secrets if you use them:
#       ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#       ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flutter-build.yml'
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'release = new base APK | patch = OTA update'
        required: true
        default: 'patch'
        type: choice
        options: [patch, release]

jobs:
  shorebird:
    name: Shorebird ${{ github.event.inputs.mode || 'patch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Configure Android signing
        id: signing
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && \
             [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${ANDROID_KEY_ALIAS:-}" ] && \
             [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/oilempire-release.jks
            {
              printf 'storeFile=app/oilempire-release.jks\n'
              printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            } > key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets missing — unsigned build"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # ── OTA patch (default on every push to main) ──────────────────────────
      - name: Shorebird patch (OTA)
        if: ${{ github.event.inputs.mode != 'release' }}
        working-directory: mobile
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: shorebird patch android --flutter-version=3.27.4

      # ── Full release (first time or when native code changes) ──────────────
      - name: Shorebird release (new base APK)
        if: ${{ github.event.inputs.mode == 'release' }}
        working-directory: mobile
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: shorebird release android --flutter-version=3.27.4

      - name: Upload release APK (artifact)
        if: ${{ github.event.inputs.mode == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: OilEmpire-release-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Publish GitHub Release (for first installs)
        if: ${{ github.event.inputs.mode == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: "OilEmpire release #${{ github.run_number }}"
          body: |
            Zainstaluj ten APK raz na telefonie.
            Kolejne aktualizacje będą automatyczne (Shorebird OTA).
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
